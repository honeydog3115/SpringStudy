plugins {
    id 'java'
    id("com.github.bjornvester.xjc") version "1.9.1"
}

group = 'com.example'
version = '1.0-SNAPSHOT'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    // ===== Spring Framework 3.1.2 =====
    implementation "org.springframework:spring-context:3.1.2.RELEASE"
    implementation "org.springframework:spring-beans:3.1.2.RELEASE"
    implementation "org.springframework:spring-core:3.1.2.RELEASE"
    implementation "org.springframework:spring-aop:3.1.2.RELEASE"
    implementation "org.springframework:spring-tx:3.1.2.RELEASE"
    implementation "org.springframework:spring-jdbc:3.1.2.RELEASE"
    implementation "org.springframework:spring-expression:3.1.2.RELEASE"
    implementation "org.springframework:spring-context-support:3.1.2.RELEASE"


    // ===== JavaMail / Activation =====
    implementation 'javax.mail:mail:1.4.7'
    implementation 'javax.activation:activation:1.1.1'

    // ===== JDBC =====
    implementation 'mysql:mysql-connector-java:5.1.49' // 8.x 말고 5.x 권장

    // ===== Logging =====
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'ch.qos.logback:logback-classic:1.2.12'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    
    implementation "jakarta.annotation:jakarta.annotation-api:2.1.1"
    implementation 'org.springframework:spring-oxm:4.2.9.RELEASE'

    // implementation 'javax.xml.bind:jaxb-api:2.3.1'
    // implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1'
    // implementation "com.sun.xml.bind:jaxb-impl:4.0.9"

    // ===== Tests =====
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.springframework:spring-test:3.1.2.RELEASE"
	testImplementation 'org.hamcrest:hamcrest:2.2'
	testImplementation 'org.mockito:mockito-core:5.12.0'
	testImplementation 'org.mockito:mockito-inline:5.2.0'
	testImplementation "org.aspectj:aspectjtools:1.6.6"

    testImplementation "com.sun.xml.bind:jaxb-impl:4.0.9"
    testImplementation "jakarta.annotation:jakarta.annotation-api:2.1.1"
    testImplementation 'org.springframework:spring-oxm:4.2.9.RELEASE'
}

test {
    useJUnit()
}


xjc {
    // xsd 파일의 위치
    xsdDir.set(layout.projectDirectory.dir("src/main/resources"))
    // 어떤 xsd 파일을 사용할지
    includes.set([
        "sqlmap.xsd"
    ])
    // 생성한 클래스를 어떤 패키지에 포함시킬지.
    // 실제 생성 경로는 build/generated/sources/xjc/... 이지만 set에 작성한 프로젝트의 패키지 경로로 사용할 수 있음.
    defaultPackage.set(
        "com.example.springbook.user.sqlservice.jaxb"
    )
}


